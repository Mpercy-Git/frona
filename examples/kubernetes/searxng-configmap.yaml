apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
data:
  settings.yml: |
    # `remove`, not `disabled`: SearXNG loads disabled engines too, and these
    # three can't load here. ahmia and torch are onion engines, skipped (and
    # logged as an error) whenever Tor isn't configured; wikidata's init calls
    # query.wikidata.org, which 403s most self-hosted instances. Frona reads
    # SearXNG's plain results and ignores infoboxes, so losing wikidata costs
    # it nothing -- drop the line if your cluster can reach WDQS.
    use_default_settings:
      engines:
        remove:
          - ahmia
          - torch
          - wikidata

    server:
      secret_key: "change-me-to-something-random"
      limiter: false

    engines:
      - name: radio browser
        disabled: true

    search:
      formats:
        - html
        - json
