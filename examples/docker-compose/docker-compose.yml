services:
  frona:
    image: ghcr.io/mpercy-git/frona:v2026.9.0
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    environment:
      - FRONA_BROWSER_WS_URL=ws://browserless:3333
      - FRONA_SEARCH_SEARXNG_BASE_URL=http://searxng:8080
    # Only needed if you plan to restrict agent network destinations.
    # See https://docs.frona.ai/platform/security/sandbox.html
    security_opt:
      - seccomp:unconfined
    depends_on:
      - browserless
      - searxng
    restart: unless-stopped

  browserless:
    image: ghcr.io/browserless/chromium:v2.42.0
    environment:
      - CONCURRENT=10
      - PORT=3333
    volumes:
      - ./data/browser_profiles:/profiles
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
      - SEARXNG_SECRET=change-me-to-something-random
    configs:
      - source: searxng-settings
        target: /etc/searxng/settings.yml
    restart: unless-stopped

configs:
  searxng-settings:
    content: |
      # `remove`, not `disabled`: SearXNG loads disabled engines too, and
      # these three can't load here. ahmia and torch are onion engines,
      # skipped (and logged as an error) whenever Tor isn't configured;
      # wikidata's init calls query.wikidata.org, which 403s most
      # self-hosted instances. Frona reads SearXNG's plain results and
      # ignores infoboxes, so losing wikidata costs it nothing -- drop the
      # line if your instance can reach WDQS.
      use_default_settings:
        engines:
          remove:
            - ahmia
            - torch
            - wikidata
      server:
        limiter: false
      engines:
        - name: radio browser
          disabled: true
      search:
        formats:
          - html
          - json
