name: Dev Build

# Manual, on-demand Docker image build for testing a branch without merging
# to main or cutting a tagged release. Trigger it from the Actions tab,
# picking whichever branch you want to build.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push Dev Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve dev tag
        id: tag
        run: |
          SLUG=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g' | sed -E 's/^-+|-+$//g')
          SHA_SHORT="${GITHUB_SHA::7}"
          echo "name=dev-${SLUG}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.name }}
          tags: ghcr.io/mpercy-git/frona:${{ steps.tag.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Dev image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/mpercy-git/frona:${{ steps.tag.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
