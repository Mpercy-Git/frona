name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same ref cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (cargo test)
    runs-on: ubuntu-latest
    # Same base as build/Dockerfile's rust-base stage, so the toolchain matches
    # what the release image is built with.
    container: rust:1.95-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install native build deps
        # Mirrors build/pkgs/builder-rust-apt.txt (libclang for bindgen-based
        # -sys crates; protobuf-compiler for presage's build scripts).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libclang-dev protobuf-compiler
          rm -rf /var/lib/apt/lists/*

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      # Compile every crate's tests. This is the check that cannot run on
      # Windows — the sandbox code uses Unix-only APIs — so it's the main reason
      # the workflow exists. Kept separate so a compile break reads distinctly
      # from a test failure.
      - name: Compile all tests
        run: cargo test --workspace --locked --no-run

      # Run the frona-server suite (channels, tasks, inference, policy, …).
      # The other crates are only compiled above: frona-browser's tests need a
      # real browser, and mcp_e2e is #[ignore]d (needs an external binary).
      - name: Run server tests
        run: cargo test -p frona-server --locked

  web:
    name: Web (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run
